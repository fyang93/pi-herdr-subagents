name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  legacy:
    name: herdr TUI POSIX regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
